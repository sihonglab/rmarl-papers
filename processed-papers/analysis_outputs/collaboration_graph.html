<style>
  :root{--bg:#0f1117;--panel:#1a1d27;--ink:#e8eaf0;--mut:#9aa3b2;--line:#2a2f3d;--accent:#5b8cff;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);}
  header{padding:18px 24px;border-bottom:1px solid var(--line);}
  h1{margin:0 0 4px;font-size:20px;}
  .sub{color:var(--mut);font-size:13px;}
  .stats{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;}
  .stat b{color:var(--accent);font-size:16px;}
  .wrap{display:flex;gap:0;height:calc(100vh - 96px);}
  #graphpane{flex:1.25;position:relative;border-right:1px solid var(--line);min-width:0;}
  #side{flex:1;overflow-y:auto;padding:16px 20px;min-width:380px;}
  svg{width:100%;height:100%;display:block;cursor:grab;}
  .legend{position:absolute;top:10px;left:10px;background:rgba(20,23,32,.85);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;max-width:260px;}
  .legend .row{display:flex;align-items:center;gap:6px;margin:2px 0;cursor:pointer;opacity:.95}
  .legend .row:hover{opacity:.6}
  .legend .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .hint{position:absolute;bottom:10px;left:10px;color:var(--mut);font-size:11px;background:rgba(20,23,32,.8);padding:4px 8px;border-radius:6px;}
  .tooltip{position:absolute;pointer-events:none;background:#11141d;border:1px solid var(--accent);border-radius:6px;padding:6px 9px;font-size:12px;max-width:260px;z-index:9;opacity:0;transition:opacity .1s}
  .node circle{stroke:#0f1117;stroke-width:1.2px;cursor:pointer}
  .node text{font-size:9px;fill:var(--mut);pointer-events:none}
  .link{stroke:#3a4252;stroke-opacity:.35}
  h2{font-size:15px;margin:18px 0 8px;border-left:3px solid var(--accent);padding-left:8px;}
  .teamcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px;}
  .teamcard h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
  .teamcard h3 .dot{width:11px;height:11px;border-radius:50%}
  .phase{margin:7px 0;font-size:12.5px;line-height:1.55}
  .phase .lbl{display:inline-block;font-weight:700;border-radius:4px;padding:1px 7px;margin-right:6px;font-size:11px}
  .lbl.past{background:#2a2f3d;color:#bcd}
  .lbl.present{background:#1d3a5f;color:#9cf}
  .lbl.future{background:#1d4d2f;color:#9f9}
  .lbl.handoff{background:#4d2f1d;color:#fc9}
  .tl{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
  .tlrow{font-size:11.5px;color:var(--mut);margin:3px 0;display:flex;gap:8px}
  .tlrow .yr{color:var(--accent);font-variant-numeric:tabular-nums;flex:0 0 78px}
  .tlrow .bk{flex:0 0 14px}
  .tlrow b{color:var(--ink);font-weight:600}
  .toggle{cursor:pointer;color:var(--accent);font-size:11px;user-select:none}
  a{color:var(--accent)}
</style>
</head>

sarial learning), optimism in the face of uncertainty (Bernstein-style/UCB bonuses), generative-model (simulator) sampling, game-theoretic equilibria (Nash equilibrium / coarse correlated equilibrium).", "venue": "NeurIPS 2022 (36th Conference on Neural Information Processing Systems)", "bucket": "Past (≤2022)"}, {"id": 2, "year": "2024", "title": "Sample-Efficient Robust MARL in Face of Environmental Uncertainty", "rob": "Environmental uncertainty (model mismatch / sim-to-real gap in the transition kernel); distributionally robust, worst-case over prescribed uncertainty sets", "method": "Model-based; distributionally robust Markov games (RMGs); (s,a)-rectangular uncertainty sets (TV distance); generative model setting; DR-NVI algorithm; information-theoretic lower bound", "venue": "ICML 2024 (Forty-First International Conference on Machine Learning)", "bucket": "Present (2023–2024)"}, {"id": 11, "year": "2024", "title": "Tractable Equilibrium Computation via Risk Aversion", "rob": "Environmental uncertainty (reward/transition) and opponent-strategy randomness, handled via risk-aversion; closely linked to distributionally robust RL/MARL through duality (worst-case disturbances within a ball around the nominal model / opponent distribution).", "method": "Game-theoretic equilibrium; risk-sensitive / risk-averse decision-making; convex risk measures + dual representation; bounded rationality (quantal response); no-regret learning; equilibrium collapse (CCE = NE = RQE in an augmented 2n-player game).", "venue": "Not specified (arXiv preprint, August 2024)", "bucket": "Present (2023–2024)"}, {"id": 3, "year": "2025", "title": "Breaking the Curse of Multiagency in Robust MARL", "rob": "Environmental uncertainty (sim-to-real gap, dynamics shift); distributionally robust, worst-case over agent-wise fictitious uncertainty sets incorporating other agents' integrated behavior", "method": "Model-based; fictitious uncertainty sets (inspired by behavioral economics / quantal response); (s,ai)-rectangularity (marginal over others' policies); generative model; Robust-Q-FTRL algorithm (online learning with FTRL + variance bonus); breaks curse of multiagency", "venue": "ICML 2025 (Forty-Second International Conference on Machine Learning)", "bucket": "Future (2025–2026)"}, {"id": 12, "year": "2025", "title": "Behavioral Economics Approach to Principled MARL", "rob": "Risk-aversion to environment/dynamics uncertainty and to opponents' strategies (uncertainty caused by the environment and other players); bounded rationality (imperfect optimization). Modeled via convex risk measures with a dual (adversarial) representation rather than an explicit uncertainty-set / threat model.", "method": "Behavioral-economics-inspired equilibrium concept (risk-averse quantal response equilibrium, RQE); game-theoretic equilibrium; convex risk measures with dual (worst-case) formulation; no-regret learning / CCE-RQE equilibrium collapse; quantal response / entropy-style regularization; dynamic programming for finite-horizon Markov games; generative-model sample complexity.", "venue": "ICLR 2025", "bucket": "Future (2025–2026)"}, {"id": 94, "year": "2025", "title": "Robust Gymnasium - Unified Modular Benchmark for Robust RL", "rob": "Unified coverage of disruptions across all stages of the agent–environment interaction — observed state perturbation, observed reward perturbation, action perturbation, and environment (transition kernel / dynamics) shift; includes random noise, adversarial attack (incl. LLM-driven), internal dynamic shift (sim-to-real), and external disturbance. Spans standard RL, safe RL, and multi-agent RL.", "method": "Benchmark / evaluation framework (not a new algorithm). Formalizes a unified \"MDP with disruption\" (Disrupted-MDP) model with three disruptor modules; benchmarks standard, robust, safe, and MARL baselines; features a two-player zero-sum adversarial-disturbance interface, including an LLM-as-adversary.", "venue": "ICLR 2025", "bucket": "Future (2025–2026)"}, {"id": 4, "year": "2026", "title": "Taming the Curses of Multiagency ... Linear Function Approximation", "rob": "Environmental uncertainty (sim-to-real gap, dynamics shift); distributionally robust with fictitious TV uncertainty sets under per-agent (s,ai)-rectangularity", "method": "Linear function approximation (LFA), fictitious uncertainty sets; L-Robust-Q-FTRL (generative model) and Online-L-Robust-Q-FTRL (online interactive); breaks curse of multiagency for RMGs with infinite/large state spaces", "venue": "arXiv preprint arXiv:2605.03125v2 (2026)", "bucket": "Future (2025–2026)"}, {"id": 5, "year": "2026", "title": "Distributionally Robust Cooperative MARL via Robust Value Factorization", "rob": "Environmental uncertainty (sim-to-real gap, model mismatch, system noise); distributionally robust, worst-case over (h,a)-rectangular uncertainty sets (ρ-contamination and TV distance)", "method": "Cooperative Dec-POMDP with CTDE; DrIGM principle; robust value factorization (VDN, QMIX, QTRAN); robust Bellman operators; deep learning (DRQN + mixing networks); practical/empirical + theoretical robustness guarantees", "venue": "ICLR 2026 (Fourteenth International Conference on Learning Representations)", "bucket": "Future (2025–2026)"}, {"id": 7, "year": "2026", "title": "Strategically Robust MARL with Linear Function Approximation", "rob": "Strategic/opponent robustness (robustness to opponent misspecification and partner perturbation/cross-play), payoff/approximation-error robustness (Lipschitz stability of the equilibrium map under estimated-payoff perturbations), plus environment/model uncertainty and risk-sensitivity via convex risk measures and distributionally robust optimization.", "method": "Risk-Sensitive / Risk-Averse Quantal Response Equilibrium (RQRE), bounded rationality (quantal response, entropy regularization), convex/coherent risk measures with dual (DRO) representation, optimistic value iteration with linear function approximation, finite-sample regret analysis.", "venue": "Not specified (arXiv preprint arXiv:2603.09208v1, dated March 2026)", "bucket": "Future (2025–2026)"}, {"id": 13, "year": "2026", "title": "Provably Convergent Actor-Critic in Risk-averse MARL", "rob": "Strategic risk aversion (agents are risk-averse against the behaviors of other agents rather than the environment); robustness/risk-aversion modeled via an imagined adversary constrained by a divergence penalty; bounded rationality.", "method": "Risk-averse Quantal-Response Equilibria (RQE), behavioral game theory, convex risk measures, monotone games, contractive risk-adjusted Bellman operator, single-timescale actor-critic (faster actor / slower critic), stochastic approximation, Lyapunov drift analysis.", "venue": "Preprint (arXiv:2602.12386v2 [cs.MA], 29 May 2026); dated \"Preprint. June 1, 2026.\"", "bucket": "Future (2025–2026)"}], "Beihang/PKU (Adversarial c-MARL)": [{"id": 63, "year": "2022", "title": "Mis-spoke or Mis-lead - Robustness in Communicative MARL", "rob": "Communication attacks (adversarial / malicious messages sent by compromised agents in cooperative MARL); Byzantine failure (agents do not know which peers are malicious)", "method": "Adversarial training, learned message attack generation, two-stage message filter (anomaly detection + reconstruction), two-player zero-sum game, game-theoretic equilibrium via Policy-Space Response Oracle (PSRO) / Double Oracle, minimax (MaxMin) defense", "venue": "AAMAS 2022 (Proc. of the 21st International Conference on Autonomous Agents and Multiagent Systems)", "bucket": "Past (≤2022)"}, {"id": 101, "year": "2022", "title": "MATE - Benchmarking MARL in Distributed Target Coverage Control", "rob": "Robustness to adversarial / non-stationary opponents and policy generalization (over-fitting to fixed opponents in distributed target coverage); robustness probed via variable agent populations (scalability) and trainable adversarial target agents; reduction of policy exploitability. (Benchmark environment rather than a robustness-specific algorithm.)", "method": "Benchmark / environment design; asymmetric two-team stochastic (cooperative-competitive zero-sum) game; self-play and population-based training (PSRO-Nash, Fictitious Self-Play, asymmetric self-play); exploitability as a robustness measure; CTDE MARL baselines", "venue": "NeurIPS 2022 (36th Conference on Neural Information Processing Systems)", "bucket": "Past (≤2022)"}, {"id": 64, "year": "2024", "title": "Robust MA Communication with Graph Information Bottleneck", "rob": "Communication attacks on GNN-based multi-agent communication — adversarial attacks and noise perturbations on the graph topological structure (adjacency matrix A, edge addition/deletion) and the agent feature embeddings (node features H)", "method": "Graph Information Bottleneck (GIB) optimization; information-theoretic regularizers (mutual-information minimization/maximization with variational bounds); graph attention network (GAT) communication; value function decomposition (VDN/QMIX/QPLEX) under CTDE", "venue": "IEEE Transactions on Pattern Analysis and Machine Intelligence (TPAMI), Vol. 46, No. 5, May 2024", "bucket": "Present (2023–2024)"}, {"id": 73, "year": "2024", "title": "Byzantine Robust Cooperative MARL as a Bayesian Game", "rob": "Byzantine failures / adversarial (and faulty) agents in cooperative MARL — any ally agent can be compromised and take arbitrary, worst-case actions (action perturbation / non-oblivious adversarial policy); also evaluated against random allies and observation-based / transfer-based attacks.", "method": "Bayesian game formulation (types assigned by nature), robust Markov perfect Bayesian equilibrium (ex interim vs. ex ante), maximin / worst-case optimization, robust Harsanyi-Bellman equation, two-timescale actor-critic with belief inference.", "venue": "ICLR 2024", "bucket": "Present (2023–2024)"}, {"id": 152, "year": "2024", "title": "Attacking cooperative MARL b const NARR = {"Caltech/CMU Theory (RMG, RQE)": {"past": "奠基于<b>一般和马尔可夫博弈的样本复杂度</b>：Q-FTRL 用生成模型在一般和 MG 上学 CCE/NE（#21, 2022），打破\"多智能体诅咒\"与长视界障碍——这是后续鲁棒化的算法母体。", "present": "把单智能体的<b>分布鲁棒 RL 搬到多智能体</b>：DR-NVI 给出首个近最优样本复杂度的 RMG 算法（#2 ICML'24），Robust-Q-FTRL 在鲁棒设定下打破多智能体诅咒（#3 ICML'25）。同时另起<b>风险规避均衡 RQE</b> 一支（#11,#12 ICLR'25），用有界理性+风险规避换取可计算性。", "future": "两条线同时向\"<b>可扩展+可证明收敛</b>\"推进：RMG 配线性函数逼近（#4, 2026）、合作 CTDE 的鲁棒值分解 DrIGM（#5 ICLR'26）、RQE 的单时间尺度 actor-critic 有限样本收敛（#13, 2026）、面向对手错配的策略鲁棒 RQRE（#7, 2026）。并产出 <b>Robust-Gymnasium</b> 统一基准（#94 ICLR'26）反哺整个领域。", "handoff": "承接逻辑：<b>非鲁棒博弈样本复杂度 → 鲁棒博弈样本复杂度 → 函数逼近/收敛性可扩展化</b>；副线 RQE 从\"可计算均衡\"分化出\"可收敛算法\"。Laixi Shi/Yuejie Chi(CMU) 提供鲁棒 RL 理论，Mazumdar 提供博弈论解概念，二者在 #2/#3/#94 融合。"}, "Beihang/PKU (Adversarial c-MARL)": {"past": "从<b>通信攻击面</b>切入：研究通信型 MARL 中恶意消息的鲁棒性，做攻击+两段式消息过滤（#63, 2022），并建 MATE 双队对抗基准（#101, 2022）。", "present": "<b>攻击方法系统化、防御理论化</b>：MARLSafe/AMI 从 state-action-reward 全面攻击并实现单智能体误导多数（#152,#99）；防御端转向<b>贝叶斯博弈下的 Byzantine 鲁棒</b>（EIR-MAPPO, #73 ICLR'24）与图信息瓶颈通信鲁棒（#64, 2024）。", "future": "走向\"<b>可证明 + 无需暴露对手</b>\"的防御：互信息正则化的 MIR2/MIR3（#31 TNNLS'25）证明惩罚互信息即最大化最坏情况鲁棒下界；即插即用容错层 MARTA（#76, 2026）；并用 8 万+实验区分\"鲁棒 vs 韧性\"（#97 NeurIPS'25）。", "handoff": "承接逻辑：<b>找攻击面（通信）→ 扩展攻击面（state/action/reward + Byzantine）→ 把防御从对抗训练升级为信息论可证明鲁棒</b>。核心轴 Simin Li × Xianglong Liu × Yaodong Yang 贯穿 #31/#73/#152，Bo An(NTU) 连接博弈论一翼。"}, "UConn/BU (Safe-Robust CAV)": {"past": "起步于<b>转移核不确定性下的鲁棒 RL</b>：数据驱动鲁棒 MARL、R-contamination 不确定集下的鲁棒 Q-learning（#20, 2022）。", "present": "<b>三向铺开</b>：(a) 状态对抗理论——MG-SPA/SAMG 的鲁棒均衡存在性与 RMAQ/RMA3C 算法（#28 TMLR'23,#29 TMLR'24）；(b) 应用——鲁棒+约束 MARL 做电动车调度 ROCOMA（#154）；(c) 安全攸关落地——分层 Safe-RMM（RMAPPO + 鲁棒 CBF）用于 CAV（#106, 2024）。还吸收 Maryland 的认证通信防御 AME（#61）。", "future": "两端深化：理论端转向<b>分布鲁棒 MG 的在线交互与平均奖励</b>（#6,#9, 2026）；落地端推进<b>含通信时延的 Real-Sim-Real</b> 部署到实车（#107, 2026）、5G-CAV（#108, 2025）。", "handoff": "承接逻辑：<b>核不确定性鲁棒 → 状态对抗鲁棒理论 → 安全约束(CBF)+真实硬件 → 在线/平均奖励 DRMG 理论回填</b>。Fei Miao(应用+安全) 与 Shaofeng Zou(鲁棒 RL 理论) 双核心，在 #28/#29/#154 交汇；与 Maryland(Yanchao Sun/Furong Huang) 经 #106 形成跨组桥。"}, "Tongji/Monmouth (State-Adversarial)": {"past": "聚焦<b>状态观测扰动</b>：把单智能体鲁棒 RL 技术迁移到 QMIX（#32, 2023），并提出平均场鲁棒 RoMFAC（#34, 2023），形式化 State-Adversarial Stochastic Game。", "present": "<b>攻击更强、更省</b>：MAPDA 把最优状态对手转成策略对手注入训练（#33, 2025）；AMCA/RTCA 动态找\"关键智能体\"只攻击少数（#51,#98）；ATSA 用随机对手做对抗训练避免过拟合最强对手（#46 ICML'25）。", "future": "向<b>真实部署与 sim-to-real</b> 延伸：对抗域随机化 + 优先回放训练可迁移的双 UAV 协同搬运策略并上实机（#135 T-IV, 2024）。", "handoff": "承接逻辑：<b>迁移单智能体鲁棒技术 → 设计 MARL 专属强攻击(关键智能体/策略对手) → 鲁棒对抗训练 → sim-to-real 真实部署</b>。Guanjun Liu × Ziyuan Zhou(各 7 篇) 是最紧密的二人核心，Weiran Guo 加入近年工作。"}, "Nanjing U/Polixir (Comm-Robust)": {"past": "从<b>有限恶意动作攻击</b>切入：ROMANCE 用进化式 Quality-Diversity 生成多样攻击者交替训练 ego 系统（#57 AAAI'23）。", "present": "转向<b>通信鲁棒</b>：CroMAC 把消息当多视角、用区间传播给出认证下界（#65, 2023）；MA3C 把通道攻击建模为合作 MARL 并进化生成对手（#169, 2024）。", "future": "（以本数据集为界）方向收敛到\"<b>认证通信鲁棒 + 进化式对手种群</b>\"的范式，预期向更大规模通信图与可证明保证延伸。", "handoff": "承接逻辑：<b>动作攻击的进化式对手 → 把同一\"进化对手种群\"范式迁移到通信通道 → 加认证(IBP)保证</b>。Yang Yu/Zongzhang Zhang(南大) + Polixir 工业背景，方法论高度自洽复用。"}, "Wisconsin (Poisoning/Game Theory)": {"past": "开局即<b>离线 MARL 奖励投毒</b>：最小代价改奖励把目标策略装成 Markov Perfect Dominant Strategy Equilibrium，化为线性规划（#54 AAAI'23）。", "present": "双向展开：投毒端给出零和博弈\"<b>唯一 Nash 集</b>\"投毒刻画（#192 AAAI'24）；鲁棒端证明 <b>RMG 与正则化博弈等价</b>且 RNE 计算 PPAD-hard（#159 ICML'24）。", "future": "（以本数据集为界）形成\"<b>攻击可解(LP) ⇄ 鲁棒均衡难解(PPAD)</b>\"的复杂度对照，预期深入可解结构刻画。", "handoff": "承接逻辑：<b>攻击的最优化刻画 → 用同一博弈论工具(均衡多面体/对偶)反推鲁棒性的可计算边界</b>。McMahan × Qiaomin Xie 主导理论，Jerry Zhu(投毒鼻祖) 提供攻击视角。"}};
</script>
<script>
// ---- stats ----
const s=DATA.stats;
document.getElementById('stats').innerHTML =
  `<div class="stat"><b>${s.papers}</b> 篇论文</div>`+
  `<div class="stat"><b>${s.authors}</b> 位作者</div>`+
  `<div class="stat"><b>${s.recurring}</b> 位高频作者(≥2篇)</div>`+
  `<div class="stat"><b>${s.edges}</b> 条合作边</div>`;

// ---- legend (teams present in narr + palette) ----
const pal=DATA.palette;
const legend=document.getElementById('legend');
let activeGroup=null;
const groupsInGraph=[...new Set(DATA.nodes.map(n=>n.group))];
const ordered=Object.keys(pal).filter(g=>groupsInGraph.includes(g));
ordered.forEach(g=>{
  const row=document.createElement('div');row.className='row';
  row.innerHTML=`<span class="dot" style="background:${pal[g]}"></span><span>${g}</span>`;
  row.onclick=()=>{activeGroup=(activeGroup===g?null:g);highlight();};
  legend.appendChild(row);
});

// ---- force graph ----
const pane=document.getElementById('graphpane');
let W=pane.clientWidth,H=pane.clientHeight;
const svg=d3.select('#graphpane').append('svg').attr('viewBox',[0,0,W,H]);
const g=svg.append('g');
svg.call(d3.zoom().scaleExtent([0.2,4]).on('zoom',e=>g.attr('transform',e.transform)));

const links=DATA.edges.map(d=>({...d}));
const nodes=DATA.nodes.map(d=>({...d}));
const sim=d3.forceSimulation(nodes)
  .force('link',d3.forceLink(links).id(d=>d.id).distance(d=>60/Math.sqrt(d.weight)).strength(d=>Math.min(1,0.25*d.weight)))
  .force('charge',d3.forceManyBody().strength(-90))
  .force('center',d3.forceCenter(W/2,H/2))
  .force('collide',d3.forceCollide().radius(d=>4+Math.sqrt(d.papers)*3));

const link=g.append('g').attr('stroke','#3a4252').selectAll('line')
  .data(links).join('line').attr('class','link')
  .attr('stroke-opacity',0.35).attr('stroke-width',d=>Math.min(5,d.weight));

const node=g.append('g').selectAll('g').data(nodes).join('g').attr('class','node')
  .call(d3.drag()
    .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y;})
    .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;})
    .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));

node.append('circle').attr('r',d=>3.5+Math.sqrt(d.papers)*3).attr('fill',d=>d.color);
node.append('text').attr('x',d=>5+Math.sqrt(d.papers)*3).attr('y',3)
  .text(d=>d.papers>=3?d.id:'');

const tt=document.getElementById('tt');
node.on('mouseover',(e,d)=>{
  tt.style.opacity=1;
  tt.innerHTML=`<b>${d.id}</b><br>${d.group}<br>论文 ${d.papers} 篇: ${d.paper_ids.map(x=>'#'+x).join(', ')}`;
}).on('mousemove',e=>{
  tt.style.left=(e.offsetX+14)+'px';tt.style.top=(e.offsetY+10)+'px';
}).on('mouseout',()=>tt.style.opacity=0);

function highlight(){
  node.style('opacity',d=>!activeGroup||d.group===activeGroup?1:0.12);
  link.style('opacity',d=>!activeGroup||(d.source.group===activeGroup&&d.target.group===activeGroup)?0.45:0.04);
}

sim.on('tick',()=>{
  link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  node.attr('transform',d=>`translate(${d.x},${d.y})`);
});
window.addEventListener('resize',()=>{
  W=pane.clientWidth;H=pane.clientHeight;svg.attr('viewBox',[0,0,W,H]);
  sim.force('center',d3.forceCenter(W/2,H/2)).alpha(.3).restart();
});

// ---- trajectory cards ----
const bkColor={'Past (≤2022)':'#8aa','Present (2023–2024)':'#9cf','Future (2025–2026)':'#9f9','n/a':'#666'};
const bkDot={'Past (≤2022)':'◐','Present (2023–2024)':'●','Future (2025–2026)':'◆','n/a':'·'};
const cards=document.getElementById('cards');
Object.keys(NARR).forEach(tname=>{
  const n=NARR[tname]; const tl=DATA.teams[tname]||[];
  const col=pal[tname]||'#ccc';
  const card=document.createElement('div');card.className='teamcard';
  let tlrows=tl.map(r=>`<div class="tlrow"><span class="yr">${r.year}</span><span class="bk" style="color:${bkColor[r.bucket]}">${bkDot[r.bucket]}</span><span><b>#${r.id}</b> ${r.title}</span></div>`).join('');
  card.innerHTML=
    `<h3><span class="dot" style="background:${col}"></span>${tname}</h3>`+
    `<div class="phase"><span class="lbl past">过去</span>${n.past}</div>`+
    `<div class="phase"><span class="lbl present">现在</span>${n.present}</div>`+
    `<div class="phase"><span class="lbl future">未来</span>${n.future}</div>`+
    `<div class="phase"><span class="lbl handoff">承接</span>${n.handoff}</div>`+
    `<div class="toggle" onclick="this.nextElementSibling.style.display=(this.nextElementSibling.style.display==='none'?'block':'none')">▸ 展开该组论文时间线 (${tl.length})</div>`+
    `<div class="tl" style="display:none">${tlrows}</div>`;
  cards.appendChild(card);
});
</script>
</body>
</html>
